<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="20" y1="24" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1d4ed8" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Shield Icon -->
  <g filter="url(#glow)">
    <path d="M32 6L14 13.5V28C14 40.5 21.6 52 32 55.5C42.4 52 50 40.5 50 28V13.5L32 6Z" fill="url(#shieldGrad)"/>
    <!-- Scanner frame accents -->
    <path d="M22 17H19V20" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 17H45V20" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 41H19V38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <path d="M42 41H45V38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <!-- Laser line -->
    <line x1="20" y1="29" x2="44" y2="29" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 3"/>
    <!-- Center Checkmark -->
    <path d="M25 29.5L29.5 34L39 23.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="66" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Metra<tspan fill="#2563eb">Scan</tspan></text>
  <text x="67" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.8">NATIONAL VERIFICATION PORTAL</text>
  <!-- Verified dot -->
  <circle cx="218" cy="24" r="3" fill="#16a34a"/>
</svg>
